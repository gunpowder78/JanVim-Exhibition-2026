<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JanVim Exhibition Safety</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Cascadia Mono", "Microsoft YaHei UI", monospace;
        background: #071014;
        color: #e8ece8;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        display: grid;
        place-content: center;
        gap: 1rem;
        margin: 0;
        cursor: none;
        text-align: center;
      }
      h1,
      p {
        margin: 0;
      }
      h1 {
        font-size: clamp(36px, 4vw, 76px);
        font-weight: 500;
        letter-spacing: 0.08em;
      }
      p {
        color: #6e9da1;
        font-size: clamp(18px, 1.4vw, 28px);
        letter-spacing: 0.12em;
      }
    </style>
  </head>
  <body>
    <h1>SECONDARY SHOW SURFACE</h1>
    <p>WAITING FOR CONTROLLER CHECKS</p>
  </body>
</html>
